<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-op Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #6a7280; --line: #e4e7ec;
    --accent: #2563eb; --accent-text: #fff; --chip: #eef1f6; --warn: #b45309; --good: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --card: #181b21; --text: #eceef2; --muted: #98a1b0; --line: #2a2f38;
      --accent: #5b8cf5; --accent-text: #0b1020; --chip: #232833; --warn: #f2b45a; --good: #5fd08a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .counts button { border: 1px solid var(--line); background: var(--card); color: var(--text);
                   border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .counts button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .filters { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
  @media (min-width: 640px) { .filters { grid-template-columns: 2fr 1fr 1fr 1fr; } }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                            background: var(--card); color: var(--text); font: inherit; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .job.done { opacity: .6; }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .co { font-weight: 600; }
  .title { margin-top: 1px; }
  .loc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { background: var(--chip); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--muted); }
  .tag.new { color: var(--good); font-weight: 600; }
  .tag.dl { color: var(--warn); font-weight: 600; }
  a.apply { background: var(--accent); color: var(--accent-text); padding: 6px 12px; border-radius: 6px;
            text-decoration: none; font-weight: 600; font-size: 13px; white-space: nowrap; }
  .row2 { display: grid; grid-template-columns: 150px 1fr; gap: 8px; margin-top: 10px; }
  .more, .tools button { border: 1px solid var(--line); background: var(--card); color: var(--text);
                          border-radius: 8px; padding: 8px 14px; cursor: pointer; font: inherit; }
  .tools { margin-top: 24px; }
  .tools textarea { height: 90px; margin-top: 8px; font: 12px monospace; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<main>
  <h1>Co-op Tracker</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="counts" id="counts"></div>
  <div class="filters">
    <input id="q" type="search" placeholder="Search company, title, location">
    <select id="pipe">
      <option value="">Both pipelines</option>
      <option value="winter">Winter 27</option>
      <option value="summer">Summer 27</option>
    </select>
    <select id="tier">
      <option value="">All companies</option>
      <option value="t1">⭐⭐ Tier 1</option>
      <option value="big">⭐ Big names +</option>
    </select>
    <select id="sort">
      <option value="found">Newest found</option>
      <option value="posted">Newest posted</option>
      <option value="deadline">Deadline first</option>
      <option value="company">Company A–Z</option>
    </select>
  </div>
  <div id="list"></div>
  <div style="text-align:center"><button class="more" id="more" hidden>Show more</button></div>
  <div class="tools">
    <button id="export">Export statuses</button>
    <button id="import">Import statuses</button>
    <textarea id="box" hidden placeholder="Statuses are saved in this browser only. Export here, paste into another device, then Import."></textarea>
  </div>
</main>
<script>
const STATUSES = ["New", "Interested", "Applied", "OA", "Interview", "Offer", "Rejected", "Skip"];
const DONE = new Set(["Rejected", "Skip"]);
const KEY = "coop-tracker-v1";
const PAGE = 60;
let jobs = [], state = {}, shown = PAGE, statusFilter = "active";

try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = new Date(); today.setHours(0, 0, 0, 0);
const daysAgo = d => d ? Math.round((today - new Date(d + "T00:00:00")) / 864e5) : null;
const statusOf = j => (state[j.id] && state[j.id].s) || "New";

function ageText(d) {
  const n = daysAgo(d);
  if (n === null) return "";
  return n <= 0 ? "posted today" : n < 14 ? `posted ${n}d ago` : `posted ${Math.floor(n / 7)}w ago`;
}
function deadlineKey(j) {
  const m = /closes (\w+) (\d+)/i.exec(j.deadline || "");
  if (!m) return j.deadline === "rolling" ? 9e12 : 9e13;
  const t = Date.parse(`${m[1]} ${m[2]}, ${today.getFullYear()}`);
  return isNaN(t) ? 9e13 : t;
}
function gone(j) {
  // LinkedIn only lists the last 24h, so absence there means nothing.
  return j.source !== "LinkedIn" && daysAgo(j.last_seen) >= 2;
}

function visible() {
  const q = $("q").value.trim().toLowerCase(), p = $("pipe").value, t = $("tier").value, sort = $("sort").value;
  let out = jobs.filter(j => {
    const st = statusOf(j);
    if (statusFilter === "active" ? DONE.has(st) : statusFilter !== "all" && st !== statusFilter) return false;
    if (p && !j.pipelines.includes(p)) return false;
    if (t === "t1" && !j.tier1) return false;
    if (t === "big" && !j.big) return false;
    if (q && !(`${j.company} ${j.title} ${j.location}`).toLowerCase().includes(q)) return false;
    return true;
  });
  const cmp = {
    found: (a, b) => b.first_seen.localeCompare(a.first_seen),
    posted: (a, b) => (b.posted || "").localeCompare(a.posted || ""),
    deadline: (a, b) => deadlineKey(a) - deadlineKey(b),
    company: (a, b) => a.company.localeCompare(b.company),
  }[sort];
  return out.sort((a, b) => (b.tier1 - a.tier1) || cmp(a, b));
}

function renderCounts() {
  const c = { all: jobs.length, active: 0 };
  STATUSES.forEach(s => c[s] = 0);
  jobs.forEach(j => { const s = statusOf(j); c[s]++; if (!DONE.has(s)) c.active++; });
  const btn = (k, label) =>
    `<button data-f="${k}" aria-pressed="${statusFilter === k}">${label} ${c[k]}</button>`;
  $("counts").innerHTML = btn("active", "Active") + STATUSES.map(s => btn(s, s)).join("") + btn("all", "All");
  $("counts").querySelectorAll("button").forEach(b => b.onclick = () => { statusFilter = b.dataset.f; shown = PAGE; render(); });
}

function render() {
  renderCounts();
  const list = visible();
  $("list").innerHTML = list.slice(0, shown).map(j => {
    const st = statusOf(j), note = (state[j.id] && state[j.id].n) || "";
    const isNew = daysAgo(j.first_seen) <= 1 && st === "New";
    const tags = [
      isNew ? '<span class="tag new">new</span>' : "",
      `<span class="tag">${esc(j.source)}</span>`,
      j.pipelines.map(p => `<span class="tag">${p === "winter" ? "Winter 27" : "Summer 27"}</span>`).join(""),
      j.term_stated ? "" : '<span class="tag">term not stated</span>',
      ageText(j.posted) ? `<span class="tag">${ageText(j.posted)}</span>` : "",
      j.deadline ? `<span class="tag dl">${esc(j.deadline)}</span>` : "",
      gone(j) ? '<span class="tag dl">may be closed</span>' : "",
    ].join("");
    return `<div class="job ${DONE.has(st) ? "done" : ""}" data-id="${esc(j.id)}">
      <div class="top"><div>
        <div class="co">${j.tier1 ? "⭐⭐ " : j.big ? "⭐ " : ""}${esc(j.company)}</div>
        <div class="title">${esc(j.title)}</div>
        <div class="loc">${esc(j.location || "Location not listed")}</div>
        <div class="tags">${tags}</div>
      </div><a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Apply</a></div>
      <div class="row2">
        <select class="st">${STATUSES.map(s => `<option${s === st ? " selected" : ""}>${s}</option>`).join("")}</select>
        <input class="note" placeholder="Notes" value="${esc(note)}">
      </div></div>`;
  }).join("") || '<div class="empty">Nothing matches these filters.</div>';
  $("more").hidden = list.length <= shown;
  $("more").textContent = `Show more (${list.length - shown} left)`;
}

$("list").addEventListener("change", e => {
  if (!e.target.classList.contains("st")) return;
  const id = e.target.closest(".job").dataset.id;
  state[id] = { ...(state[id] || {}), s: e.target.value };
  save(); render();
});
$("list").addEventListener("input", e => {
  if (!e.target.classList.contains("note")) return;
  const id = e.target.closest(".job").dataset.id;
  state[id] = { ...(state[id] || {}), n: e.target.value };
  save(); // no re-render: keep focus in the box
});
["q", "pipe", "tier", "sort"].forEach(id => $(id).addEventListener("input", () => { shown = PAGE; render(); }));
$("more").onclick = () => { shown += PAGE; render(); };
$("export").onclick = () => { $("box").hidden = false; $("box").value = JSON.stringify(state); $("box").select(); };
$("import").onclick = () => {
  if ($("box").hidden) { $("box").hidden = false; $("box").value = ""; $("box").focus(); return; }
  try { state = { ...state, ...JSON.parse($("box").value) }; save(); render(); $("box").hidden = true; }
  catch (e) { alert("That doesn't look like exported statuses."); }
};

fetch("jobs.json", { cache: "no-cache" }).then(r => r.json()).then(data => {
  jobs = data;
  const latest = data.reduce((m, j) => j.last_seen > m ? j.last_seen : m, "");
  $("sub").textContent = `${data.length} roles tracked · last refreshed ${latest || "n/a"} · statuses stay in this browser`;
  render();
}).catch(() => { $("sub").textContent = "Couldn't load jobs.json."; });
</script>
</body>
</html>
